@if (auth.user(); as user) {
  <header class="app-header">
    <h1>Stuff Inventory</h1>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/items" routerLinkActive="active">Items</a>
      <a routerLink="/locations" routerLinkActive="active">Locations</a>
    </nav>
    <div class="user-menu">
      @if (user.picture) {
        <img [src]="user.picture" [alt]="user.name || user.email" />
      }
      <span>{{ user.name || user.email }}</span>
      <button type="button" (click)="auth.logout()">Sign out</button>
    </div>
  </header>
}

<main>
  <router-outlet />
</main>
